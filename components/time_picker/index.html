<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    color: #e2e8f0;
    background: transparent;
    user-select: none;
  }
  .tp-label {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 5px;
  }
  .tp-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-radius: 14px;
    border: 1px solid rgba(165,200,255,.22);
    background: linear-gradient(180deg, rgba(148,184,255,.16), rgba(59,130,246,.09));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
    cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .tp-field:hover {
    background: linear-gradient(180deg, rgba(148,184,255,.24), rgba(59,130,246,.15));
  }
  .tp-field.open {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 2px rgba(96,165,250,.35);
  }
  .tp-field-val {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    color: #f8fafc;
  }
  .tp-icon { width: 17px; height: 17px; flex: none; }
  .tp-panel {
    margin-top: 8px;
    border: 1px solid rgba(165,200,255,.22);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(30,41,59,.72), rgba(15,23,42,.72));
    padding: 12px 14px 14px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .tp-value {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: #f8fafc;
    margin-bottom: 8px;
  }
  .tp-ampm {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tp-ampm button {
    flex: 1;
    border: 1px solid rgba(165,200,255,.25);
    background: rgba(148,184,255,.10);
    color: #94a3b8;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 0;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s ease, color .15s ease;
  }
  .tp-ampm button.on {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
  }
  .tp-clock-wrap {
    display: flex;
    justify-content: center;
  }
  .tp-clock {
    width: 100%;
    max-width: 300px;
    cursor: pointer;
  }
  .tp-caption {
    text-align: center;
    font-size: 12px;
    color: rgba(226,232,240,.55);
    margin-top: 6px;
  }
  .tp-close {
    width: 100%;
    margin-top: 10px;
    border: 1px solid rgba(165,200,255,.25);
    background: rgba(148,184,255,.10);
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 0;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .tp-close:hover { background: rgba(148,184,255,.20); }
</style>
</head>
<body>
<div class="tp-label" id="lbl"></div>
<div class="tp-field" id="field" role="button" tabindex="0">
  <span class="tp-field-val" id="fval">00:00</span>
  <svg class="tp-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(226,232,240,.75)" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7v5l3 2"/>
  </svg>
</div>
<div class="tp-panel" id="panel" hidden>
  <div class="tp-value" id="val">00:00</div>
  <div class="tp-ampm">
    <button id="btnAM" type="button">AM</button>
    <button id="btnPM" type="button">PM</button>
  </div>
  <div class="tp-clock-wrap">
    <svg id="clock" class="tp-clock" viewBox="0 0 300 300" aria-label="Pilih jam">
      <defs>
        <radialGradient id="bg" cx="50%" cy="42%" r="65%">
          <stop offset="0%" stop-color="rgba(148,184,255,.22)"/>
          <stop offset="100%" stop-color="rgba(59,130,246,.10)"/>
        </radialGradient>
      </defs>
      <circle cx="150" cy="150" r="128" fill="url(#bg)" stroke="rgba(165,200,255,.25)" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="tp-caption" id="cap"></div>
  <button class="tp-close" id="btnClose" type="button">Tutup</button>
</div>
<script src="component-lib.js"></script>
<script>
  const CX = 150, CY = 150;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('clock');
  const lbl = document.getElementById('lbl');
  const val = document.getElementById('val');
  const fval = document.getElementById('fval');
  const cap = document.getElementById('cap');
  const field = document.getElementById('field');
  const panel = document.getElementById('panel');
  const btnAM = document.getElementById('btnAM');
  const btnPM = document.getElementById('btnPM');
  const btnClose = document.getElementById('btnClose');

  const pad = n => String(n).padStart(2, '0');

  const st = {
    open: false,
    mode: 'hour',
    h12: 12,
    min: 0,
    pm: false,
    committed: '00:00'
  };

  function parseValue(v) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(v || '');
    if (!m) return false;
    const h24 = parseInt(m[1], 10) % 24;
    const min = parseInt(m[2], 10) % 60;
    st.h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    st.min = min;
    st.pm = h24 >= 12;
    return true;
  }

  function fmt() {
    const h24 = st.pm ? (st.h12 % 12) + 12 : st.h12 % 12;
    return pad(h24) + ':' + pad(st.min);
  }

  function angleDeg(i, total) { return i * (360 / total) - 90; }

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function drawClock() {
    while (svg.lastChild && svg.lastChild.tagName !== 'circle') svg.removeChild(svg.lastChild);
    const inHour = st.mode === 'hour';
    const g = document.createElementNS(NS, 'g');
    svg.appendChild(g);

    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0;
      const a = angleDeg(i, 60) * Math.PI / 180;
      const r1 = major ? 108 : 112;
      const r2 = major ? 120 : 118;
      const t = el('line', {
        x1: CX + Math.cos(a) * r1, y1: CY + Math.sin(a) * r1,
        x2: CX + Math.cos(a) * r2, y2: CY + Math.sin(a) * r2,
        stroke: i === st.min && !inHour ? '#3b82f6' : (major ? 'rgba(226,232,240,.60)' : 'rgba(226,232,240,.30)'),
        'stroke-width': major ? 2.5 : 1.2,
        'stroke-linecap': 'round'
      });
      g.appendChild(t);
    }

    const numR = 96;
    for (let h = 1; h <= 12; h++) {
      const a = angleDeg(h, 12) * Math.PI / 180;
      const x = CX + Math.cos(a) * numR, y = CY + Math.sin(a) * numR;
      const sel = inHour && h === st.h12;
      if (sel) g.appendChild(el('circle', { cx: x, cy: y, r: 15, fill: '#3b82f6' }));
      const t = el('text', {
        x: x, y: y + 5.5,
        'text-anchor': 'middle',
        fill: sel ? '#ffffff' : (inHour ? '#e2e8f0' : 'rgba(226,232,240,.35)'),
        'font-size': 16,
        'font-weight': sel ? 700 : 500
      });
      t.textContent = String(h);
      g.appendChild(t);
    }

    if (inHour) {
      const a = angleDeg(st.h12 % 12, 12) * Math.PI / 180;
      g.appendChild(el('line', {
        x1: CX, y1: CY, x2: CX + Math.cos(a) * 70, y2: CY + Math.sin(a) * 70,
        stroke: '#60a5fa', 'stroke-width': 3, 'stroke-linecap': 'round'
      }));
    } else {
      for (let i = 0; i < 60; i += 5) {
        const a = angleDeg(i, 60) * Math.PI / 180;
        const x = CX + Math.cos(a) * 86, y = CY + Math.sin(a) * 86;
        const sel = i === st.min;
        const t = el('text', {
          x: x, y: y + 4,
          'text-anchor': 'middle',
          fill: sel ? '#ffffff' : 'rgba(226,232,240,.85)',
          'font-size': 12,
          'font-weight': sel ? 700 : 500
        });
        t.textContent = pad(i);
        g.appendChild(t);
      }
      const a = angleDeg(st.min, 60) * Math.PI / 180;
      g.appendChild(el('circle', { cx: CX + Math.cos(a) * 62, cy: CY + Math.sin(a) * 62, r: 6, fill: '#3b82f6' }));
      g.appendChild(el('line', {
        x1: CX, y1: CY, x2: CX + Math.cos(a) * 62, y2: CY + Math.sin(a) * 62,
        stroke: '#60a5fa', 'stroke-width': 3, 'stroke-linecap': 'round'
      }));
    }

    g.appendChild(el('circle', { cx: CX, cy: CY, r: 4.5, fill: '#e2e8f0' }));
  }

  function render() {
    fval.textContent = st.committed;
    if (!st.open) return;
    drawClock();
    val.textContent = fmt();
    cap.textContent = st.mode === 'hour' ? 'Klik angka jam' : 'Klik posisi menit';
    btnAM.classList.toggle('on', !st.pm);
    btnPM.classList.toggle('on', st.pm);
  }

  function commitAndSend() {
    st.committed = fmt();
    Streamlit.setComponentValue(st.committed);
  }

  function apply(args) {
    if (args.label) lbl.textContent = args.label;
    const v = args.value;
    if (v && v !== st.committed) {
      if (parseValue(v)) {
        st.committed = v;
        st.mode = 'hour';
      }
    }
    render();
  }

  function open() {
    st.open = true;
    st.mode = 'hour';
    if (!parseValue(st.committed)) parseValue('00:00');
    field.classList.add('open');
    panel.hidden = false;
    render();
    fixHeight();
  }

  function close() {
    st.open = false;
    parseValue(st.committed);
    field.classList.remove('open');
    panel.hidden = true;
    render();
    fixHeight();
  }

  field.addEventListener('click', () => (st.open ? close() : open()));
  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); st.open ? close() : open(); }
  });
  btnClose.addEventListener('click', close);

  svg.addEventListener('click', (e) => {
    const r = svg.getBoundingClientRect();
    const ux = (e.clientX - r.left) * (300 / r.width);
    const uy = (e.clientY - r.top) * (300 / r.height);
    const dx = ux - CX, dy = uy - CY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 40 || dist > 140) return;
    let ang = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    if (ang < 0) ang += 360;
    if (st.mode === 'hour') {
      let h = Math.round(ang / 30) % 12;
      if (h === 0) h = 12;
      st.h12 = h;
      st.mode = 'minute';
      render();
    } else {
      st.min = Math.round(ang / 6) % 60;
      commitAndSend();
      close();
    }
  });

  btnAM.addEventListener('click', () => {
    if (st.pm) { st.pm = false; commitAndSend(); render(); }
  });
  btnPM.addEventListener('click', () => {
    if (!st.pm) { st.pm = true; commitAndSend(); render(); }
  });

  function fixHeight() {
    Streamlit.setFrameHeight(document.body.scrollHeight + 8);
  }

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (e) => apply(e.detail.args));
  parseValue('00:00');
  render();
  Streamlit.setComponentReady();
  fixHeight();
  window.addEventListener('resize', fixHeight);
</script>
</body>
</html>
