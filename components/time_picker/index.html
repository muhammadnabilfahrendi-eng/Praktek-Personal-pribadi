<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Source Sans", "Segoe UI", sans-serif;
    color: #fafafa;
    background: transparent;
    user-select: none;
  }
  .tp-label {
    font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 22.4px;
    min-height: 24px;
    color: rgb(226, 232, 240);
    margin-bottom: 4px;
  }
  .tp-field {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 40px;
    padding: 0 8px 0 12px;
    border: 1px solid rgba(165, 200, 255, 0.22);
    border-radius: 14px;
    background: linear-gradient(rgba(148, 184, 255, 0.2), rgba(59, 130, 246, 0.12));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    cursor: text;
    outline: none;
  }
  .tp-seg {
    font-size: 14px;
    font-weight: 400;
    line-height: 19.6px;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    color: #fafafa;
    padding: 4px 7px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .tp-seg:hover { background: rgba(148, 184, 255, 0.18); }
  .tp-seg.sel {
    background: rgba(59, 130, 246, 0.32);
    color: #ffffff;
  }
  .tp-colon {
    font-size: 14px;
    color: rgba(226, 232, 240, 0.65);
  }
  .tp-steps {
    display: flex;
    flex-direction: column;
    margin-left: auto;
    opacity: .85;
  }
  .tp-steps button {
    width: 20px;
    height: 13px;
    border: none;
    background: transparent;
    color: rgba(226, 232, 240, 0.8);
    font-size: 9px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
  }
  .tp-steps button:hover { color: #ffffff; background: rgba(148, 184, 255, 0.18); }
  .tp-steps button:active { color: #60a5fa; }
</style>
</head>
<body>
<div class="tp-label" id="lbl"></div>
<div class="tp-field" id="field" tabindex="0">
  <span class="tp-seg" id="hh" data-part="hh">08</span>
  <span class="tp-colon">:</span>
  <span class="tp-seg" id="mm" data-part="mm">00</span>
  <div class="tp-steps">
    <button id="up" type="button" aria-label="Naik">▲</button>
    <button id="dn" type="button" aria-label="Turun">▼</button>
  </div>
</div>
<script src="component-lib.js"></script>
<script>
  const field = document.getElementById('field');
  const segH = document.getElementById('hh');
  const segM = document.getElementById('mm');
  const btnUp = document.getElementById('up');
  const btnDn = document.getElementById('dn');
  const lbl = document.getElementById('lbl');

  const pad = n => String(n).padStart(2, '0');

  const st = {
    hh: 8,
    mm: 0,
    active: null,
    buf: ''
  };

  function send() {
    Streamlit.setComponentValue(pad(st.hh) + ':' + pad(st.mm));
  }

  function render() {
    segH.textContent = st.active === 'hh' && st.buf ? st.buf : pad(st.hh);
    segM.textContent = st.active === 'mm' && st.buf ? st.buf : pad(st.mm);
    segH.classList.toggle('sel', st.active === 'hh');
    segM.classList.toggle('sel', st.active === 'mm');
  }

  function inc(part, dir) {
    const max = part === 'hh' ? 23 : 59;
    st[part] = (st[part] + dir + max + 1) % (max + 1);
    st.buf = '';
    send();
    render();
  }

  function setActive(part) {
    st.active = part;
    st.buf = '';
    render();
    field.focus();
  }

  segH.addEventListener('click', () => setActive('hh'));
  segM.addEventListener('click', () => setActive('mm'));
  btnUp.addEventListener('click', () => inc(st.active || 'hh', 1));
  btnDn.addEventListener('click', () => inc(st.active || 'mm', -1));

  field.addEventListener('wheel', (e) => {
    e.preventDefault();
    inc(st.active || 'hh', e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  field.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      inc(st.active || 'hh', e.key === 'ArrowUp' ? 1 : -1);
    } else if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      if (!st.active) st.active = 'hh';
      st.buf += e.key;
      if (st.buf.length >= 2) {
        st[st.active] = parseInt(st.buf, 10);
        st.buf = '';
        send();
      }
      render();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      if (st.buf) { st.buf = ''; render(); }
      else if (st.active) { setActive(null); }
    } else if (e.key === 'Enter' && st.buf) {
      e.preventDefault();
      st[st.active] = parseInt(st.buf, 10);
      st.buf = '';
      send();
      render();
    }
  });

  function apply(args) {
    if (args.label) lbl.textContent = args.label;
    const m = /^(\d{1,2}):(\d{2})$/.exec(args.value || '');
    if (m) {
      const nh = parseInt(m[1], 10) % 24;
      const nm = parseInt(m[2], 10) % 60;
      if (nh !== st.hh || nm !== st.mm) {
        st.hh = nh;
        st.mm = nm;
        render();
      }
    }
  }

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (e) => apply(e.detail.args));
  render();
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(document.body.scrollHeight + 8);
  window.addEventListener('resize', () => Streamlit.setFrameHeight(document.body.scrollHeight + 8));
</script>
</body>
</html>
