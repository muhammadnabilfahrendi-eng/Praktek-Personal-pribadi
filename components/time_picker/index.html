<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  label {
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
  }
  input[type="time"] {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 14px;
    border-radius: 14px;
    border: 1px solid rgba(165,200,255,.22);
    background: linear-gradient(180deg, rgba(148,184,255,.16), rgba(59,130,246,.09));
    color: #e2e8f0;
    font-size: 15px;
    font-family: 'Segoe UI', sans-serif;
    color-scheme: dark;
    outline: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
    transition: background .15s ease, box-shadow .15s ease;
  }
  input[type="time"]:hover {
    background: linear-gradient(180deg, rgba(148,184,255,.24), rgba(59,130,246,.15));
  }
  input[type="time"]:focus {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 2px rgba(96,165,250,.35);
  }
  input[type="time"]::-webkit-calendar-picker-indicator {
    filter: invert(0.75);
    cursor: pointer;
  }
</style>
</head>
<body>
<label id="lbl" for="tp"></label>
<input type="time" id="tp" />
<script src="component-lib.js"></script>
<script>

  const input = document.getElementById('tp');
  const lbl = document.getElementById('lbl');

  function apply(args) {
    if (args.label) lbl.textContent = args.label;
    const v = args.value;
    if (v) {
      input.value = v;
    } else if (!input.value) {
      input.value = '00:00';
    }
  }

  input.addEventListener('change', () => {
    Streamlit.setComponentValue(input.value || '');
  });

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (e) => apply(e.detail.args));
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(64);
</script>
</body>
</html>
