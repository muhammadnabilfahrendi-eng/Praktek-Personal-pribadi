<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    color: #e2e8f0;
    background: transparent;
    user-select: none;
  }
  .tp-label {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 5px;
  }
  .tp-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tp-row select {
    flex: 1;
    min-width: 0;
    appearance: auto;
    padding: 7px 10px;
    border-radius: 12px;
    border: 1px solid rgba(165,200,255,.22);
    background: linear-gradient(180deg, rgba(148,184,255,.16), rgba(59,130,246,.09));
    color: #f8fafc;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    color-scheme: dark;
    outline: none;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
    transition: background .15s ease, box-shadow .15s ease;
  }
  .tp-row select:hover {
    background: linear-gradient(180deg, rgba(148,184,255,.24), rgba(59,130,246,.15));
  }
  .tp-row select:focus {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 2px rgba(96,165,250,.35);
  }
  .tp-colon {
    font-size: 16px;
    font-weight: 700;
    color: rgba(226,232,240,.65);
  }
</style>
</head>
<body>
<div class="tp-label" id="lbl"></div>
<div class="tp-row">
  <select id="hh" aria-label="Jam"></select>
  <span class="tp-colon">:</span>
  <select id="mm" aria-label="Menit"></select>
</div>
<script src="component-lib.js"></script>
<script>
  const hh = document.getElementById('hh');
  const mm = document.getElementById('mm');
  const lbl = document.getElementById('lbl');

  const pad = n => String(n).padStart(2, '0');

  for (let i = 0; i < 24; i++) {
    const o = document.createElement('option');
    o.value = pad(i);
    o.textContent = pad(i);
    hh.appendChild(o);
  }
  for (let i = 0; i < 60; i++) {
    const o = document.createElement('option');
    o.value = pad(i);
    o.textContent = pad(i);
    mm.appendChild(o);
  }

  function send() {
    Streamlit.setComponentValue(hh.value + ':' + mm.value);
  }

  function apply(args) {
    if (args.label) lbl.textContent = args.label;
    const m = /^(\d{1,2}):(\d{2})$/.exec(args.value || '');
    if (m) {
      hh.value = pad(parseInt(m[1], 10) % 24);
      mm.value = pad(parseInt(m[2], 10) % 60);
    }
  }

  hh.addEventListener('change', send);
  mm.addEventListener('change', send);

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (e) => apply(e.detail.args));
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(document.body.scrollHeight + 8);
  window.addEventListener('resize', () => Streamlit.setFrameHeight(document.body.scrollHeight + 8));
</script>
</body>
</html>
