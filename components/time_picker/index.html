<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    color: #e2e8f0;
    background: transparent;
    user-select: none;
  }
  .tp-label {
    font-size: 13px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 5px;
  }
  .tp-field {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 8px 6px 12px;
    border-radius: 12px;
    border: 1px solid rgba(165,200,255,.22);
    background: linear-gradient(180deg, rgba(148,184,255,.16), rgba(59,130,246,.09));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
    cursor: text;
    transition: background .15s ease, box-shadow .15s ease;
    outline: none;
  }
  .tp-field:focus-within,
  .tp-field.active {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 2px rgba(96,165,250,.35);
  }
  .tp-seg {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    color: #f8fafc;
    padding: 4px 6px;
    border-radius: 8px;
    cursor: pointer;
    min-width: 28px;
    text-align: center;
    transition: background .12s ease, color .12s ease;
  }
  .tp-seg:hover { background: rgba(148,184,255,.18); }
  .tp-seg.sel {
    background: rgba(59,130,246,.35);
    box-shadow: inset 0 0 0 1px rgba(96,165,250,.55);
    color: #ffffff;
  }
  .tp-colon {
    font-size: 16px;
    font-weight: 600;
    color: rgba(226,232,240,.65);
  }
  .tp-steps {
    display: flex;
    flex-direction: column;
    margin-left: auto;
  }
  .tp-steps button {
    width: 22px;
    height: 14px;
    border: none;
    background: transparent;
    color: rgba(226,232,240,.75);
    font-size: 10px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    border-radius: 5px;
    font-family: inherit;
  }
  .tp-steps button:hover { color: #ffffff; background: rgba(148,184,255,.18); }
  .tp-steps button:active { color: #60a5fa; }
  .tp-hint {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(226,232,240,.45);
  }
</style>
</head>
<body>
<div class="tp-label" id="lbl"></div>
<div class="tp-field" id="field" tabindex="0">
  <span class="tp-seg" id="hh" data-part="hh">08</span>
  <span class="tp-colon">:</span>
  <span class="tp-seg" id="mm" data-part="mm">00</span>
  <div class="tp-steps">
    <button id="up" type="button" aria-label="Naik">▲</button>
    <button id="dn" type="button" aria-label="Turun">▼</button>
  </div>
</div>
<div class="tp-hint" id="hint"></div>
<script src="component-lib.js"></script>
<script>
  const field = document.getElementById('field');
  const segH = document.getElementById('hh');
  const segM = document.getElementById('mm');
  const btnUp = document.getElementById('up');
  const btnDn = document.getElementById('dn');
  const hint = document.getElementById('hint');
  const lbl = document.getElementById('lbl');

  const pad = n => String(n).padStart(2, '0');

  const st = {
    hh: 8,
    mm: 0,
    active: null,
    buf: ''
  };

  function send() {
    Streamlit.setComponentValue(pad(st.hh) + ':' + pad(st.mm));
  }

  function render() {
    segH.textContent = st.active === 'hh' && st.buf ? st.buf : pad(st.hh);
    segM.textContent = st.active === 'mm' && st.buf ? st.buf : pad(st.mm);
    segH.classList.toggle('sel', st.active === 'hh');
    segM.classList.toggle('sel', st.active === 'mm');
    field.classList.toggle('active', st.active !== null);
    hint.textContent = st.active
      ? 'Ketik 2 angka, panah ▲▼, atau scroll roda'
      : 'Klik angka jam atau menit';
  }

  function inc(part, dir) {
    const max = part === 'hh' ? 23 : 59;
    st[part] = (st[part] + dir + max + 1) % (max + 1);
    st.buf = '';
    send();
    render();
  }

  function setActive(part) {
    st.active = part;
    st.buf = '';
    render();
    field.focus();
  }

  segH.addEventListener('click', () => setActive('hh'));
  segM.addEventListener('click', () => setActive('mm'));
  btnUp.addEventListener('click', () => inc(st.active || 'hh', 1));
  btnDn.addEventListener('click', () => inc(st.active || 'mm', -1));

  field.addEventListener('wheel', (e) => {
    e.preventDefault();
    const part = st.active || 'hh';
    inc(part, e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  field.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      const part = st.active || 'hh';
      inc(part, e.key === 'ArrowUp' ? 1 : -1);
    } else if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      if (!st.active) st.active = 'hh';
      st.buf += e.key;
      if (st.buf.length >= 2) {
        st[st.active] = parseInt(st.buf, 10);
        st.buf = '';
        send();
      }
      render();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      if (st.buf) { st.buf = ''; render(); }
      else if (st.active) { setActive(null); }
    } else if (e.key === 'Enter' && st.buf) {
      e.preventDefault();
      st[st.active] = parseInt(st.buf, 10);
      st.buf = '';
      send();
      render();
    }
  });

  function apply(args) {
    if (args.label) lbl.textContent = args.label;
    const m = /^(\d{1,2}):(\d{2})$/.exec(args.value || '');
    if (m) {
      const nh = parseInt(m[1], 10) % 24;
      const nm = parseInt(m[2], 10) % 60;
      if (nh !== st.hh || nm !== st.mm) {
        st.hh = nh;
        st.mm = nm;
        render();
      }
    }
  }

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (e) => apply(e.detail.args));
  render();
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(document.body.scrollHeight + 8);
  window.addEventListener('resize', () => Streamlit.setFrameHeight(document.body.scrollHeight + 8));
</script>
</body>
</html>
